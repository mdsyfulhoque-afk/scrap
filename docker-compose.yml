services:

  minio:
    image: quay.io/minio/minio:latest
    container_name: data-fetcher-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: datafetcheradmin
      MINIO_ROOT_PASSWORD: "DataFetcher-MinIO-2026!"

    volumes:
      - minio_data:/data

    ports:
      - "9000:9000"
      - "9001:9001"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:18
    container_name: data-fetcher-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: datafetcher
      POSTGRES_PASSWORD: "DataFetcher-Postgres-2026!"
      POSTGRES_DB: data_catalog

    volumes:
      - postgres_data:/var/lib/postgresql

    ports:
      - "5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datafetcher -d data_catalog"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  minio_data:
  postgres_data:
