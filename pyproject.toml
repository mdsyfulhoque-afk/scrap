[project]
name = "data_fetcher"
version = "0.3.0"
description = "CPU-first, provenance-preserving web acquisition and dataset construction"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
    "boto3>=1.30.0",
    "psycopg[binary]>=3.2",
    "minio>=7.2.0",
    "langdetect>=1.0.9",
    "nltk>=3.8",
    "python-dotenv>=1.0",
    "pluggy>=1.0",
]

[project.scripts]
data-fetcher = "data_fetcher.demo:main"

[project.entry-points."data_fetcher"]
requests_fetcher = "data_fetcher.plugins.fetchers.requests_fetcher:RequestsFetcherPlugin"
heuristic_extractor = "data_fetcher.plugins.extractors.heuristic_extractor:HeuristicExtractorPlugin"
postgres_minio_storage = "data_fetcher.plugins.storages.postgres_minio_storage:PostgresMinioStoragePlugin"
standard_normalizer = "data_fetcher.plugins.normalizers.standard_normalizer:StandardNormalizerPlugin"
trigram_jaccard_dedupe = "data_fetcher.plugins.dedupes.trigram_jaccard:TrigramJaccardDedupePlugin"
jsonl_exporter = "data_fetcher.plugins.exporters.jsonl_exporter:JsonlExporterPlugin"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["setuptools>=67.0.0", "wheel"]
build-backend = "setuptools.build_meta"
